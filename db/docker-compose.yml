services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devicemonitor-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_Strong_Pass123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Your_Strong_Pass123!' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

volumes:
  mssql_data:
